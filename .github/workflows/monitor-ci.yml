name: monitor-ci

on:
  push:
    branches: [main]
    paths:
      - "aegis-monitor/**"
      - ".github/workflows/monitor-ci.yml"
  pull_request:
    paths:
      - "aegis-monitor/**"
      - ".github/workflows/monitor-ci.yml"

defaults:
  run:
    working-directory: aegis-monitor

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aegis-monitor/pyproject.toml

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest -q --tb=short
