# Build + push aegis-monitor image to ECR and roll the Fargate service.
#
# Manually triggered for now — auto-deploy on main push will be enabled
# once the infra in #23 is applied and these secrets are populated:
#
#   secrets.AWS_DEPLOY_ROLE_ARN     IAM role assumed via OIDC; allows
#                                   ecr:* on the monitor repo + ecs:UpdateService
#                                   on the monitor service.
#   secrets.AWS_REGION              e.g. us-east-1
#   secrets.ECR_REPOSITORY          e.g. aegis-monitor
#   secrets.ECS_CLUSTER             e.g. aegis-prod
#   secrets.ECS_SERVICE             e.g. aegis-monitor
#
# OIDC trust policy on the deploy role must allow:
#   token.actions.githubusercontent.com
#   sub: repo:jon-tompkins/aegis-public:ref:refs/heads/main
#
# When ready to switch from manual to auto: change `on:` to include
#   push:
#     branches: [main]
#     paths: ["aegis-monitor/**"]

name: monitor-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (defaults to short commit SHA)"
        required: false
        default: ""

permissions:
  id-token: write   # OIDC for AWS auth
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: aegis-monitor
        run: |
          docker build \
            -t "${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}" \
            -t "${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest"

      - name: Roll ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment \
            --query "service.{name: serviceName, status: status, desiredCount: desiredCount}" \
            --output table

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"
